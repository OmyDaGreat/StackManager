services:
  stackmanager:
    image: ${STACKMGR_IMAGE}
    container_name: stackmanager
    restart: unless-stopped
    volumes:
      - /srv/compose:/srv/compose
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - STACKMGR_TOKEN=${STACKMGR_TOKEN}
      # The app runs inside the container, so it should listen on all interfaces there.
      - STACKMGR_BIND_HOST=${STACKMGR_BIND_HOST:-0.0.0.0}
      - STACKMGR_PORT=8080
    ports:
      # Only publish the host port on your Tailscale IP so it is never exposed publicly
      - "${STACKMGR_PUBLISH_HOST:-127.0.0.1}:8080:8080"
