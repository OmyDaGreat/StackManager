services:
  stackmanager:
    image: ghcr.io/omydagreat/stackmanager:latest
    container_name: stackmanager
    restart: unless-stopped
    volumes:
      - /srv/compose:/srv/compose
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - STACKMGR_TOKEN=${STACKMGR_TOKEN}
      - STACKMGR_BIND_HOST=100.x.y.z
      - STACKMGR_PORT=8080
    ports:
      - "100.x.y.z:8080:8080"
