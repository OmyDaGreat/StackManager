services:
  stackmanager:
    image: ${STACKMGR_IMAGE}
    container_name: stackmanager
    restart: unless-stopped
    volumes:
      - /srv/compose:/srv/compose
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - STACKMGR_TOKEN=${STACKMGR_TOKEN}
      # Set STACKMGR_BIND_HOST in your .env file to your Pi's Tailscale IP
      - STACKMGR_BIND_HOST=${STACKMGR_BIND_HOST:-127.0.0.1}
      - STACKMGR_PORT=8080
    ports:
      # Only bind on your Tailscale IP so the port is never exposed publicly
      - "${STACKMGR_BIND_HOST:-127.0.0.1}:8080:8080"
