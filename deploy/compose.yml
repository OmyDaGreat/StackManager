services:
  stackmanager:
    image: ghcr.io/omydagreat/stackmanager:latest
    container_name: stackmanager
    restart: unless-stopped
    volumes:
      - /srv/compose:/srv/compose
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - STACKMGR_TOKEN=${STACKMGR_TOKEN}
      - STACKMGR_BIND_HOST=YOUR_TAILSCALE_IP  # Replace with your Tailscale IP, e.g. 100.64.0.1
      - STACKMGR_PORT=8080
    ports:
      - "YOUR_TAILSCALE_IP:8080:8080"  # Replace YOUR_TAILSCALE_IP with your actual Tailscale IP
